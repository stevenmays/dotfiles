<title>Plan Document</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafaf7;
    --fg: #1b1b18;
    --muted: #5b5b56;
    --accent: #c8553d;
    --border: #1b1b18;
    --border-soft: #c8c8c2;
    --code: #f1f1ec;
    --ok: #2a6f4e;
    --warn: #9a6a1f;
    --err: #a73326;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #161613; --fg: #ecece6; --muted: #9c9c95; --accent: #e07a5f;
      --border: #ecece6; --border-soft: #3a3a36; --code: #232320;
      --ok: #6ab089; --warn: #d9a25a; --err: #d96959;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161613; --fg: #ecece6; --muted: #9c9c95; --accent: #e07a5f;
    --border: #ecece6; --border-soft: #3a3a36; --code: #232320;
    --ok: #6ab089; --warn: #d9a25a; --err: #d96959;
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  .col { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 700px) { .col, nav.toc ol { padding-left: 24px; padding-right: 24px; } }
  .skip-link {
    position: absolute; left: -9999px; top: 8px; z-index: 20;
    padding: 8px 12px; background: var(--accent); color: var(--bg);
  }
  .skip-link:focus { left: 16px; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, .diagram-box:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  header.head { padding-top: 40px; padding-bottom: 20px; }
  h1 {
    font: 700 32px/1.15 var(--serif); letter-spacing: -0.01em;
    margin: 0 0 12px; overflow-wrap: anywhere;
  }
  .lede { font-size: 18px; margin: 0 0 14px; }
  p, li { max-width: 70ch; }
  .chips, .meta, .fams { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
  header .chips { margin-bottom: 16px; }
  .chip {
    display: inline-block; max-width: 100%; overflow-wrap: anywhere;
    font: 12px/1.5 var(--mono); padding: 1px 7px;
    border: 1px solid var(--border-soft); border-radius: 3px; color: var(--muted);
  }
  .chip .k { margin-right: 0.45em; font-weight: 700; text-transform: none; letter-spacing: 0; }
  .tone-ok { color: var(--ok); border-color: currentColor; }
  .tone-warn { color: var(--warn); border-color: currentColor; }
  .tone-crit { color: var(--err); border-color: currentColor; }
  .tone-accent { color: var(--accent); border-color: currentColor; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: 13px/1.4 system-ui, sans-serif; padding: 6px 12px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--border); border-radius: 2px; cursor: pointer;
  }
  button:hover, #btn-theme[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  nav.toc {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--border-soft);
    border-top: 1px solid var(--border-soft);
  }
  nav.toc ol {
    list-style: none; margin: 0 auto; padding: 0 16px; max-width: 860px;
    display: flex; gap: 2px; overflow-x: auto; white-space: nowrap; scrollbar-width: thin;
  }
  nav.toc a {
    display: block; padding: 10px 8px; font-size: 13px;
    color: var(--muted); text-decoration: none;
  }
  nav.toc a:hover { color: var(--fg); }
  main section { padding: 28px 0 8px; scroll-margin-top: 56px; }
  main section + section { border-top: 1px solid var(--border-soft); }
  h2 { font: 700 22px/1.25 var(--serif); margin: 0 0 14px; }
  h3 { font: 600 17px/1.3 var(--serif); margin: 18px 0 8px; }
  p { margin: 0 0 12px; }
  ul.plain { margin: 0 0 14px; padding-left: 1.3em; }
  ul.plain li { margin: 4px 0; }
  code {
    font: 0.86em var(--mono); background: var(--code);
    padding: 0.05em 0.3em; border-radius: 2px; overflow-wrap: anywhere;
  }
  .k {
    font: 600 11px/1.4 var(--mono); text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
  }
  .empty { font-style: italic; color: var(--muted); padding: 24px 0; }
  .verdicts { border: 1px solid var(--border); border-radius: 3px; }
  .verdicts > * { padding: 10px 14px; margin: 0; max-width: none; }
  .verdicts > * + * { border-top: 1px solid var(--border-soft); }
  .claims { font: 13px/1.5 var(--mono); background: var(--code); overflow-wrap: anywhere; }
  .round { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 6px 16px; align-items: baseline; }
  .round .rlabel { font: 12px/1.5 var(--mono); color: var(--muted); }
  .round .note { grid-column: 2; font-size: 15px; }
  .status { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .callout {
    border: 1px solid var(--border-soft); border-left: 3px solid var(--accent);
    border-radius: 0 3px 3px 0; background: var(--code);
    padding: 10px 14px; margin: 0 0 14px;
  }
  .callout > .k { display: block; margin-bottom: 4px; }
  .callout p:last-child { margin-bottom: 0; }
  .callout strong { display: block; }
  .points {
    list-style: none; padding: 0; margin: 0 0 12px;
    display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .points li { border: 1px solid var(--border-soft); border-radius: 3px; padding: 12px 14px; }
  .points strong { display: block; margin-bottom: 4px; }
  .points p { margin: 0; font-size: 15px; }
  .diagram { margin: 0; }
  .diagram-box {
    overflow-x: auto; border: 1px solid var(--border-soft); border-radius: 3px; padding: 8px;
  }
  .diagram-box svg { display: block; max-width: none; }
  figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .dg-node rect { fill: var(--bg); stroke: var(--border); stroke-width: 1.25; }
  .dg-node text { font: 12px var(--mono); fill: var(--fg); text-anchor: middle; }
  .dg-node text.sub { font-size: 10.5px; fill: var(--muted); }
  .dg-terminal rect { stroke-width: 2.25; }
  .dg-terminal rect.inner { stroke-width: 1; fill: none; }
  .dg-error rect { stroke: var(--err); }
  .dg-error text, .dg-error text.sub { fill: var(--err); }
  .dg-external rect { stroke: var(--muted); stroke-dasharray: 4 3; }
  .dg-external text { fill: var(--muted); }
  .dg-edge { fill: none; stroke: var(--muted); stroke-width: 1.25; }
  .dg-edge.to-err { stroke: var(--err); }
  .dg-arrow { fill: var(--muted); }
  .dg-arrow.err { fill: var(--err); }
  .dg-label rect { fill: var(--bg); }
  .dg-label text { font: 11px var(--mono); fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
  table.ledger { width: 100%; border-collapse: collapse; border: 1px solid var(--border-soft); margin: 0 0 14px; }
  .ledger th {
    font: 600 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.06em;
    text-align: left; background: var(--code); padding: 8px 10px;
  }
  .ledger td {
    font: 13px/1.5 var(--mono); padding: 8px 10px; vertical-align: top;
    border-top: 1px solid var(--border-soft); overflow-wrap: anywhere;
  }
  .ledger td:first-child { font-weight: 600; }
  .ledger code { background: none; padding: 0; font-size: 1em; }
  .steps { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; }
  .step {
    display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 0 10px;
    border: 1px solid var(--border-soft); border-radius: 3px; padding: 10px 14px;
  }
  .steps > li { max-width: none; }
  .step.separable { border: 1px dashed var(--muted); }
  .step.qcard { border-left: 3px solid var(--accent); }
  .step p { margin: 0; }
  .step .q { font-weight: 600; }
  .step .meta { margin-top: 6px; }
  .num { font: 700 14px/1.6 var(--mono); color: var(--accent); }
  .sub-block { margin-top: 8px; padding: 8px 10px; background: var(--code); border-radius: 2px; }
  .sub-block .k { display: block; }
  .checks { list-style: none; padding: 0; margin: 0 0 14px; }
  .checks li { position: relative; padding-left: 1.6em; margin: 6px 0; }
  .checks li::before { content: "\25A1"; position: absolute; left: 0; color: var(--muted); }
  .risks { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 12px; }
  .risks li { border-left: 2px solid var(--warn); padding: 2px 0 2px 12px; }
  .risks strong { display: block; }
  .risks p { margin: 2px 0 0; }
  footer.prov { margin-top: 32px; padding-top: 16px; padding-bottom: 48px; border-top: 1px solid var(--border); }
  footer.prov dl {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px 20px; margin: 0;
  }
  footer.prov dt { font: 600 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  footer.prov dd { margin: 0; font: 13px/1.5 var(--mono); overflow-wrap: anywhere; }
  @media (max-width: 600px) {
    h1 { font-size: 26px; }
    .lede { font-size: 17px; }
    .round { grid-template-columns: minmax(0, 1fr); }
    .round .note { grid-column: 1; }
    .ledger thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .ledger tr { display: block; padding: 6px 0; border-top: 1px solid var(--border-soft); }
    .ledger tr:first-child { border-top: 0; }
    .ledger td { display: block; border: 0; padding: 3px 10px; }
    .ledger td::before {
      content: attr(data-label); display: block; font: 600 10.5px/1.4 var(--mono);
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    }
  }
  @media print {
    :root[data-theme], :root:not([data-theme]) {
      color-scheme: light;
      --bg: #fff; --fg: #1b1b18; --muted: #5b5b56; --accent: #c8553d;
      --border: #1b1b18; --border-soft: #c8c8c2; --code: #f1f1ec;
      --ok: #2a6f4e; --warn: #9a6a1f; --err: #a73326;
    }
    nav.toc, .actions, .skip-link { display: none !important; }
    .diagram-box { overflow: visible; }
    .step, .points li, .risks li, .verdicts { break-inside: avoid; }
  }
</style>
</head>

<script type="application/json" id="plan-data">
{
  "template": "plan-document",
  "plan_title": "Retry failed webhook deliveries with backoff and a dead-letter queue",
  "lede": "A webhook delivery that fails once is dropped today, and customers re-sync by polling. This plan adds retries with exponential backoff and jitter, a per-endpoint circuit breaker, and a dead-letter queue that support can replay. Scope: the `webhooks` service and its Postgres tables. The public API doesn't change.",
  "chips": ["rev 4", "closes #175", "plan + code: Opus", "risk: medium"],
  "verdicts": {
    "claims": "CLAIMS: 24 extracted — 22 supported, 1 contradicted, 0 unsupported, 1 unverifiable; 1 corrected",
    "rounds": [
      {
        "label": "Review, rev 2",
        "families": [{"name": "Opus", "verdict": "revise"}, {"name": "GPT", "verdict": "block"}],
        "note": "GPT blocked because a worker restart mid-delivery sends the same attempt twice. Opus asked for a per-endpoint concurrency cap."
      },
      {
        "label": "Review, rev 4",
        "families": [{"name": "Opus", "verdict": "approve"}, {"name": "GPT", "verdict": "approve"}],
        "note": "Lease-based claiming fixes the double send. The concurrency cap is now change 5."
      }
    ],
    "status": {"label": "Ready for your approval", "note": "Two open questions need an answer before build."}
  },
  "problem": [
    "The `deliver_webhook` job makes one HTTP attempt with a 10 s timeout. On a non-2xx response or a timeout it logs `delivery_failed` and drops the event. In the last 30 days that dropped 41,200 of 3.1 million deliveries (1.3%).",
    "Most failures are transient: 78% are 502, 503, or timeouts that clear within 15 minutes. Customers recover by polling `GET /events`, which is 22% of API traffic. Support has no way to replay a dropped event."
  ],
  "how_it_works": {
    "paragraphs": [
      "Each delivery becomes a row in `webhook_deliveries` with a state, an attempt count, and a `next_attempt_at` time. Workers claim due rows with `FOR UPDATE SKIP LOCKED` and hold a 60 s lease, so a restarted worker can't send the same attempt twice.",
      "A failed attempt schedules the next one. After 8 attempts, about 24 hours, the delivery moves to the dead-letter queue."
    ],
    "replaces": "The fire-and-forget `deliver_webhook` job and its `delivery_failed` log line.",
    "points": [
      {"title": "Backoff with full jitter", "text": "Attempt n waits a random time between 0 and `min(6h, 30s × 2^n)`, so a recovering endpoint doesn't get every retry at once."},
      {"title": "Per-endpoint circuit breaker", "text": "Five failures in a row pause that endpoint for 5 minutes. Its deliveries stay queued instead of spending attempts."},
      {"title": "Dead letters and replay", "text": "Exhausted deliveries land in `webhook_dead_letters` for 30 days. Support replays one with `webhooks replay \u003cid>` or a whole endpoint with `--endpoint`."}
    ]
  },
  "diagram": {
    "kind": "state",
    "caption": "Lifecycle of one delivery. Dashed edges are failure paths. The lines along the bottom loop back to Queued.",
    "nodes": [
      {"id": "queued", "label": "Queued", "sub": "row is due"},
      {"id": "sending", "label": "Sending", "sub": "60 s lease"},
      {"id": "lost", "label": "Lease lost", "sub": "worker died", "kind": "error"},
      {"id": "delivered", "label": "Delivered", "sub": "2xx", "kind": "terminal"},
      {"id": "failed", "label": "Failed", "sub": "5xx, timeout", "kind": "error"},
      {"id": "backoff", "label": "Backing off", "sub": "30 s × 2^n"},
      {"id": "breaker", "label": "Breaker open", "sub": "5 min pause"},
      {"id": "disabled", "label": "Disabled", "sub": "410 Gone", "kind": "terminal"},
      {"id": "dead", "label": "Dead letter", "sub": "kept 30 days"},
      {"id": "halfopen", "label": "Half-open", "sub": "1 probe"},
      {"id": "pager", "label": "On-call page", "sub": "50+ per hour", "kind": "external"},
      {"id": "replayed", "label": "Replayed", "sub": "by support"}
    ],
    "edges": [
      {"from": "queued", "to": "sending", "label": "claim"},
      {"from": "sending", "to": "lost", "label": "crash", "dashed": true},
      {"from": "sending", "to": "delivered", "label": "2xx"},
      {"from": "sending", "to": "failed", "label": "error", "dashed": true},
      {"from": "failed", "to": "backoff", "label": "retry"},
      {"from": "failed", "to": "breaker", "label": "5 fails"},
      {"from": "failed", "to": "disabled", "label": "410"},
      {"from": "failed", "to": "dead", "label": "8 tries"},
      {"from": "breaker", "to": "halfopen", "label": "5 min"},
      {"from": "dead", "to": "pager", "label": "alert"},
      {"from": "dead", "to": "replayed", "label": "support"},
      {"from": "lost", "to": "queued", "label": "requeue"},
      {"from": "backoff", "to": "queued", "label": "timer fires"},
      {"from": "halfopen", "to": "queued", "label": "probe"},
      {"from": "replayed", "to": "queued", "label": "attempt 1"}
    ]
  },
  "behavior_changes": [
    {"area": "Failed delivery", "today": "Dropped after 1 attempt", "after": "Retried up to 8 times over about 24 h"},
    {"area": "Drop rate, 30 days", "today": "1.3% (41,200 of 3.1M)", "after": "Under 0.1% expected"},
    {"area": "Worker restart mid-send", "today": "Event lost", "after": "Requeued within 60 s, sent once"},
    {"area": "Support replay", "today": "Not possible", "after": "`webhooks replay \u003cid>` for 30 days"}
  ],
  "approach": {
    "chosen": [
      "Keep the queue in Postgres. We already run it, the delivery rows double as the delivery history, and `SKIP LOCKED` claims rows safely at our peak of 1,200 deliveries per minute."
    ],
    "rejected": {
      "option": "Move deliveries to SQS with a redrive policy",
      "reason": "It adds a second store to keep in step with `events`, and SQS visibility timeouts can't express per-endpoint backoff or the breaker."
    }
  },
  "units": [
    {"text": "Add migration `0042_webhook_deliveries`: columns `state`, `attempt`, `next_attempt_at`, `lease_until`, and an index on `(state, next_attempt_at)`.", "separable": false},
    {"text": "Write the `RetryPolicy` module: full-jitter backoff, 6 h cap, 8 attempts, and the status rules (retry 5xx, 408, 429; stop on other 4xx; disable on 410).", "separable": false},
    {"text": "Replace the `deliver_webhook` job body with a claim loop that uses `FOR UPDATE SKIP LOCKED` and a 60 s lease.", "separable": false},
    {"text": "Honor `Retry-After` on 429 and 503 responses, capped at 6 h.", "separable": false},
    {"text": "Cap each endpoint at 4 deliveries in flight.", "separable": false},
    {"text": "Add the per-endpoint circuit breaker: open after 5 failures in a row, half-open after 5 minutes.", "separable": false},
    {"text": "Move exhausted deliveries to `webhook_dead_letters` and delete them after 30 days.", "separable": false},
    {"text": "Emit `webhook_attempts_total{outcome}`, `webhook_dead_letters_total`, and queue lag; page on-call above 50 dead letters per hour.", "separable": false},
    {"text": "Add the `webhooks replay` command for one id or a whole endpoint, with `--dry-run`.", "separable": true},
    {"text": "Add a Grafana dashboard for retry volume, breaker state, and queue lag.", "separable": true}
  ],
  "gates": [
    {"step": "Run `make migrate` against staging.", "expect": "Migration `0042` applies in under 5 s and `webhook_deliveries` has the `(state, next_attempt_at)` index.", "owner": "you"},
    {"step": "Deploy `webhooks` to staging with `WEBHOOK_RETRIES=on`.", "expect": "Health checks pass and all 3 worker pods log `claim loop started`.", "owner": "you"},
    {"step": "Point a test endpoint at the staging mock set to return 503 for 10 minutes, then 200.", "expect": "Attempts land about 30 s, 60 s, 120 s, 240 s, and 480 s apart, then the delivery reaches `delivered`. The mock's log shows no duplicate."},
    {"step": "Delete one worker pod mid-delivery with `kubectl delete pod`.", "expect": "The leased row returns to `queued` within 60 s and is delivered exactly once."},
    {"step": "Make the mock fail 6 times in a row for one endpoint.", "expect": "The breaker opens after the 5th failure for 5 minutes. Other endpoints keep delivering."},
    {"step": "Make the mock return 410.", "expect": "The endpoint is disabled after one attempt and the account owner gets one email."},
    {"step": "Run `webhooks replay --endpoint ep_test --dry-run`, then run it without `--dry-run`.", "expect": "The dry run lists 12 dead letters. The real run requeues those 12 at attempt 1.", "owner": "support on-call"},
    {"step": "Turn on the `webhook_retries` flag for 10% of production endpoints for 24 h.", "expect": "Drop rate under 0.1%, p95 queue lag under 30 s, and the dead-letter alert stays silent.", "owner": "you + SRE"}
  ],
  "acceptance": [
    "A delivery that fails with 5xx, 408, 429, or a timeout retries up to 8 times over about 24 h.",
    "A worker restart never causes a second send of the same attempt.",
    "A delivery that exhausts its retries appears in `webhook_dead_letters` and support can replay it.",
    "An endpoint that returns 410 is disabled after one attempt.",
    "Dropped deliveries fall from 1.3% to under 0.1% in the 10% canary."
  ],
  "test_plan": {
    "unit": [
      "`RetryPolicy` delays for attempts 1 to 8 stay inside the jitter bounds and never pass 6 h.",
      "Status rules: 5xx, 408, and 429 retry; 400, 401, and 404 stop; 410 disables.",
      "Two workers never claim the same row (Postgres test container)."
    ],
    "smoke": [
      "Staging mock endpoint that returns 503 for 10 minutes, then 200.",
      "Delete a worker pod mid-delivery and check the mock's log for duplicates."
    ],
    "not_local": [
      "Retry volume against real customer endpoints.",
      "PagerDuty routing for the dead-letter alert."
    ]
  },
  "questions": [
    {"question": "Do 429 responses count toward the circuit breaker?", "recommendation": "No. Honor `Retry-After` instead, because a rate-limited endpoint is healthy.", "decide_by": "before build"},
    {"question": "How long do we keep dead letters?", "recommendation": "30 days, to match the event retention window.", "decide_by": "before build"},
    {"question": "Does the account owner get an email when a 410 disables an endpoint?", "recommendation": "Yes, one email per endpoint.", "decide_by": "before canary"},

      const lines = wrap(S(n.label) || id, 17, 3);

        kind: ["terminal", "error", "external"].includes(S(n.kind)) ? S(n.kind) : "step",

    const seen = new Map();

    const fwd = edges.filter((e) => !e.back);
    const indeg = new Map([...items.keys()].map((k) => [k, 0]));
    fwd.forEach((e) => indeg.set(e.to, indeg.get(e.to) + 1));

      const u = items.get(queue.shift());

        if (e.from !== u.id) return;
        const t = items.get(e.to);
        t.layer = Math.max(t.layer, u.layer + 1);
        indeg.set(e.to, indeg.get(e.to) - 1);
        if (!indeg.get(e.to)) queue.push(e.to);
      });
    }

    const layers = [];
    const put = (it) => (layers[it.layer] = layers[it.layer] || []).push(it);
    const link = (a, b) => { a.out.push(b); b.inn.push(a); };
    items.forEach(put);
    fwd.forEach((e) => {
      const end = items.get(e.to);
      e.chain = [items.get(e.from)];
      for (let L = e.chain[0].layer + 1; L < end.layer; L++) {
        const d = { dummy: true, h: 10, layer: L, inn: [], out: [] };
        put(d); link(e.chain[e.chain.length - 1], d); e.chain.push(d);
      }
      link(e.chain[e.chain.length - 1], end); e.chain.push(end);
    });
    for (let L = 0; L < layers.length; L++) layers[L] = layers[L] || [];
    for (let s = 0; s < 4; s++) {
      const down = s % 2 === 0;
      layers.map((_, i) => (down ? i : layers.length - 1 - i)).slice(1).forEach((L) => {
        const ref = new Map(layers[down ? L - 1 : L + 1].map((it, i) => [it, i]));
        const key = new Map(layers[L].map((it, i) => {
          const nb = (down ? it.inn : it.out).filter((o) => ref.has(o));
          return [it, nb.length ? nb.reduce((a, o) => a + ref.get(o), 0) / nb.length : i];
        }));
        layers[L].sort((a, b) => key.get(a) - key.get(b));

    const labelW = (t) => t.length * 6.7 + 10;
    const colW = layers.map((l) => Math.max(40, ...l.filter((it) => !it.dummy).map((it) => it.w)));
    const gap = layers.map((_, L) => Math.max(48, ...fwd.filter((e) => e.label && e.chain[0].layer === L).map((e) => labelW(e.label) + 22)));

    });
    const mid = (it) => it.y + it.h / 2;
    const segs = [];
    fwd.forEach((e) => e.chain.slice(1).forEach((b, i) => segs.push({ e, a: e.chain[i], b })));
    layers.flat().forEach((it) => {
      [["a", "b", "y1"], ["b", "a", "y2"]].forEach(([me, other, prop]) => {
        const mine = segs.filter((s) => s[me] === it).sort((p, q) => mid(p[other]) - mid(q[other]));
        const step = Math.min(8, (it.h - 20) / Math.max(1, mine.length - 1));
        mine.forEach((s, i) => { s[prop] = mid(it) + (i - (mine.length - 1) / 2) * step; });
      });
    });

    const root = svg("svg", { role: "img", "aria-label": S(dg.caption) || name, class: "dg" });
    svg("title", {}, root, S(dg.caption) || name);
    const defs = svg("defs", {}, root);
    ["dg-arrow", "dg-arrow-err"].forEach((id) => {
      const m = svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
      svg("path", { d: "M0 0L10 5L0 10z", class: id === "dg-arrow" ? "dg-arrow" : "dg-arrow err" }, m);
    });
    const edgeG = svg("g", {}, root);
    const nodeG = svg("g", {}, root);
    const labelG = svg("g", {}, root);
    const nodes = layers.flat().filter((it) => !it.dummy);
    const boxes = nodes.map((it) => [it.x, it.y, it.w, it.h]);
    const labels = [];
    const extent = [];
    const hits = (r, b, m) => r[0] < b[0] + b[2] + m && b[0] < r[0] + r[2] + m && r[1] < b[1] + b[3] + m && b[1] < r[1] + r[3] + m;
    const bottom = () => Math.max(...boxes.concat(labels).map((r) => r[1] + r[3]));
    // First clear candidate wins; the last resort sits below everything, so a label never covers a node or a label.
    const placeLabel = (text, cands) => {
      const w = labelW(text);
      const fits = (c) => {
        const r = [c[0] - w / 2, c[1] - 8, w, 16];
        return boxes.every((b) => !hits(r, b, 4)) && labels.every((b) => !hits(r, b, 3)) && r;
      };
      const r = cands.map(fits).find(Boolean) || fits([cands[0][0], bottom() + 20]);
      labels.push(r);
      const g = svg("g", { class: "dg-label" }, labelG);
      svg("rect", { x: r[0], y: r[1], width: w, height: 16, rx: 2 }, g);
      svg("text", { x: r[0] + w / 2, y: r[1] + 8 }, g, text);
    };
    const drawEdge = (e, d) => {
      const err = items.get(e.to).kind === "error";
      const p = svg("path", { d, class: err ? "dg-edge to-err" : "dg-edge", "marker-end": err ? "url(#dg-arrow-err)" : "url(#dg-arrow)" }, edgeG);
      if (e.dashed) p.setAttribute("stroke-dasharray", "5 4");
    };
    const bez = (p0, p1, p2, p3, t) => (1 - t) ** 3 * p0 + 3 * (1 - t) ** 2 * t * p1 + 3 * (1 - t) * t * t * p2 + t ** 3 * p3;

    fwd.forEach((e) => {
      const mine = segs.filter((s) => s.e === e);
      const ends = (s) => [s.a.x + s.a.w, s.b.x, (s.b.x - s.a.x - s.a.w) / 2];
      const d = mine.map((s, i) => {
        const [x1, x2, dx] = ends(s);
        return (i ? "L" : "M") + x1 + " " + s.y1 + "C" + (x1 + dx) + " " + s.y1 + " " + (x2 - dx) + " " + s.y2 + " " + x2 + " " + s.y2;
      }).join("");
      drawEdge(e, d);
      if (!e.label) return;
      const s = mine[0];
      const [x1, x2, dx] = ends(s);
      const at = (t) => [bez(x1, x1 + dx, x2 - dx, x2, t), bez(s.y1, s.y1, s.y2, s.y2, t)];
      const c = at(0.5);
      placeLabel(e.label, [c, at(0.35), at(0.65), ...[1, -1, 2, -2, 3, -3, 4, -4].map((k) => [c[0], c[1] + k * 20])]);
    });

    const base = bottom() + 24;
    const exits = new Map();
    const entries = new Map();
    edges.filter((e) => e.back).forEach((e, i) => {
      const a = items.get(e.from);
      const b = items.get(e.to);
      const lane = base + i * 26;
      const ne = exits.get(a.layer) || 0;
      const nn = entries.get(b.layer) || 0;
      exits.set(a.layer, ne + 1);
      entries.set(b.layer, nn + 1);
      const gx = a.x + a.w + 6 + ne * 5;
      const tx = b.x - 8 - nn * 5;
      const sy = a.y + a.h - 5;
      const ty = b.y + b.h - 5;
      extent.push([tx, lane], [gx, lane]);
      drawEdge(e, "M" + (a.x + a.w) + " " + sy + "H" + (gx - 6) + "Q" + gx + " " + sy + " " + gx + " " + (sy + 6) +
        "V" + (lane - 6) + "Q" + gx + " " + lane + " " + (gx - 6) + " " + lane + "H" + (tx + 6) +
        "Q" + tx + " " + lane + " " + tx + " " + (lane - 6) + "V" + (ty + 6) + "Q" + tx + " " + ty + " " + (tx + 6) + " " + ty + "H" + b.x);
      if (!e.label) return;
      const cx = (gx + tx) / 2;
      const step = labelW(e.label) + 8;
      placeLabel(e.label, [[cx, lane], [cx - step, lane], [cx + step, lane], [cx, lane + 20]]);
    });

    nodes.forEach((it) => {
      const g = svg("g", { class: "dg-node dg-" + it.kind }, nodeG);
      svg("title", {}, g, it.title);
      svg("rect", { x: it.x, y: it.y, width: it.w, height: it.h, rx: 3 }, g);
      if (it.kind === "terminal") svg("rect", { x: it.x + 3, y: it.y + 3, width: it.w - 6, height: it.h - 6, rx: 2, class: "inner" }, g);
      const cx = it.x + it.w / 2;
      const t = svg("text", { x: cx, y: it.y + 21 }, g);
      it.lines.forEach((line, i) => svg("tspan", { x: cx, y: it.y + 21 + i * 16 }, t, line));
      if (it.sub) svg("text", { x: cx, y: it.y + 19 + it.lines.length * 16, class: "sub" }, g, it.sub);
    });

    const pts = boxes.concat(labels).flatMap((r) => [[r[0], r[1]], [r[0] + r[2], r[1] + r[3]]]).concat(extent);
    const minX = Math.min(...pts.map((p) => p[0])) - 4;
    const minY = Math.min(...pts.map((p) => p[1])) - 4;
    const w = Math.ceil(Math.max(...pts.map((p) => p[0])) + 4 - minX);
    const h = Math.ceil(Math.max(...pts.map((p) => p[1])) + 4 - minY);
    root.setAttribute("viewBox", minX + " " + minY + " " + w + " " + h);
    root.setAttribute("width", w);
    root.setAttribute("height", h);
    return root;
  }
})();
</script>
</body>
